# general settings
name: Snn_Deraining_Restormer_dbg_fresh
model_type: SNNImageCleanModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: ./Deraining/Datasets/train/Rain13K/target
    dataroot_lq: ./Deraining/Datasets/train/Rain13K/input
    geometric_augs: true

    filename_tmpl: '{}'
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 0
    batch_size_per_gpu: 2

    ### -------------Progressive training--------------------------
    mini_batch_sizes: [2,2,2,2,2,2]             # Batch size per gpu   
    iters: [92000,64000,48000,36000,36000,24000]
    gt_size: 88   # Max patch size for progressive training
    gt_sizes: [88,88,88,88,88,88]  # Patch sizes for progressive training.
    ### ------------------------------------------------------------

    ### ------- Training on single fixed-patch size 128x128---------
    # mini_batch_sizes: [8]   
    # iters: [300000]
    # gt_size: 128   
    # gt_sizes: [128]
    ### ------------------------------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: ./Deraining/Datasets/test/Rain100L/target
    dataroot_lq: ./Deraining/Datasets/test/Rain100L/input
    io_backend:
      type: disk

# network structures
network_g:
  type: SpikingRestormer
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4,6,6,8]
  num_refinement_blocks: 4
  heads: [1,2,4,8]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: WithBias
  dual_pixel_task: False
  spike_T: 2
  spike_qk: true
  spike_decay: 0.25
  spike_vth: 0.5
  spike_surrogate_scale: 10.0
  spike_reset: soft
  spike_log: true
  spike_log_interval: 1


# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 3000
  warmup_iter: -1 # no warm up
  use_grad_clip: true
  debug_grad: true
  spike_log_freq: 10

  # Single cosine cycle over total_iter:
  # LR decays from initial lr to eta_min.
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [3000]
    restart_weights: [1]
    eta_mins: [0.000001]
  
  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]
  
  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  window_size: 0
  tile_size: 88
  tile_overlap: 16
  val_freq: 999999999
  save_img: true
  save_gt_interval: 200
  rgb2bgr: true
  use_image: true
  max_minibatch: 2

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: true

# logging settings
logger:
  print_freq: 10
  save_checkpoint_freq: 10
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
